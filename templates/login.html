<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - متوسطة عبدالرحمن الغافقي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #1e293b; padding: 35px; border-radius: 20px; border: 2px solid #38bdf8; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); }
        .login-card h2 { text-align: center; color: #38bdf8; margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
        .form-group input { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #475569; border-radius: 10px; color: white; font-size: 1rem; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: white; border: none; padding: 14px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 0.9rem; font-weight: bold; }
        .register-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
        .register-link a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fa-solid fa-school"></i> متوسطة عبدالرحمن الغافقي</h2>
        {% if error %}
        <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}
        <form action="/" method="POST">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> اسم المستخدم:</label>
                <input type="text" name="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور:</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>
        <div class="register-link">ليس لديك حساب؟ <a href="/register">سجل الآن</a></div>
    </div>
</body>
</html>
