<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل حساب جديد - متوسطة عبدالرحمن الغافقي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .register-card { background: #1e293b; padding: 35px; border-radius: 20px; border: 2px solid #38bdf8; width: 100%; max-width: 450px; }
        .register-card h2 { text-align: center; color: #38bdf8; margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #475569; border-radius: 10px; color: white; font-size: 1rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #38bdf8; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: white; border: none; padding: 14px; font-size: 1.05rem; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); }
        .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold; }
        .login-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
        .login-link a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2><i class="fa-solid fa-user-plus"></i> تسجيل حساب جديد</h2>
        {% if error %}
        <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
        {% endif %}
        <form action="/register" method="POST">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> اسم المستخدم:</label>
                <input type="text" name="username" placeholder="أدخل اسم المستخدم (مثال: anas)" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور:</label>
                <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-id-badge"></i> نوع الحساب (الدور):</label>
                <select name="role" id="roleSelect" onchange="toggleFields()" required>
                    <option value="student">طالب</option>
                    <option value="teacher">معلم</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-school"></i> المرحلة الدراسية:</label>
                <select name="stage" required>
                    <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
                </select>
            </div>
            <div class="form-group" id="subjectGroup" style="display: none;">
                <label><i class="fa-solid fa-book-open"></i> المادة الدراسية:</label>
                <select name="subject">
                    <option value="الرياضيات">الرياضيات</option>
                    <option value="العلوم">العلوم</option>
                    <option value="الدراسات الاجتماعية">الدراسات الاجتماعية</option>
                    <option value="لغتي">لغتي</option>
                    <option value="التربية الإسلامية">التربية الإسلامية</option>
                    <option value="التربية البدنية">التربية البدنية</option>
                    <option value="التربية الفنية">التربية الفنية</option>
                    <option value="المهارات الرقمية">المهارات الرقمية</option>
                    <option value="اللغة الإنجليزية">اللغة الإنجليزية</option>
                </select>
            </div>
            <div class="form-group" id="classGroup">
                <label><i class="fa-solid fa-users"></i> رقم الفصل:</label>
                <select name="class_num">
                    <option value="1">الثالث المتوسط (3 / 1)</option>
                    <option value="2">الثالث المتوسط (3 / 2)</option>
                    <option value="3">الثالث المتوسط (3 / 3)</option>
                    <option value="4">الثالث المتوسط (3 / 4)</option>
                    <option value="5">الثالث المتوسط (3 / 5)</option>
                    <option value="6">الثالث المتوسط (3 / 6)</option>
                    <option value="7">الثالث المتوسط (3 / 7)</option>
                    <option value="8">الثالث المتوسط (3 / 8)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">تسجيل الحساب</button>
        </form>
        <div class="login-link">لديك حساب بالفعل؟ <a href="/">تسجيل الدخول</a></div>
    </div>
    <script>
        function toggleFields() {
            const role = document.getElementById('roleSelect').value;
            document.getElementById('subjectGroup').style.display = (role === 'teacher') ? 'block' : 'none';
            document.getElementById('classGroup').style.display = (role === 'student') ? 'block' : 'none';
        }
    </script>
</body>
</html>
